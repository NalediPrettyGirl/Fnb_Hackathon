<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Gig — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/skill-arena.css">
  <link rel="stylesheet" href="../css/gig-hub.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/track-guides.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="app-body">
  <!-- Sidebar and top bar are injected by js/components/shell.js -->
  <div class="app-container" id="appContainer">
    <main class="app-main" id="appMain">
      <div class="content-viewport">
        <section class="view-panel active">
          <div class="view-header">
            <div class="view-header-titles">
              
              <h1 class="view-title"><span id="postGigHeading">Post a Gig</span></h1>
              <p class="view-subtitle">Describe the work, set a budget and list the skills you need.</p>
            </div>
            <div class="view-header-actions"><a class="btn btn-secondary" href="my-gigs.html">Back to My Gigs</a></div>
          </div>
          <form class="form-card" id="gigForm" novalidate>
            <div class="form-group">
              <label for="gigTitle">Title</label>
              <input type="text" id="gigTitle" class="form-input" maxlength="120" placeholder="e.g. Build a small business landing page" required>
              <p class="form-hint">3–120 characters.</p>
            </div>
            <div class="form-group">
              <label for="gigDescription">Description</label>
              <textarea id="gigDescription" class="form-textarea" rows="7" maxlength="5000" placeholder="What needs to be done, deliverables, timeline…" required></textarea>
              <p class="form-hint">10–5000 characters.</p>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="gigBudget">Budget (ZAR)</label>
                <input type="number" id="gigBudget" class="form-input" min="0" step="50" placeholder="1500" required>
              </div>
              <div class="form-group">
                <label for="gigSkills">Required skills</label>
                <input type="text" id="gigSkills" class="form-input" placeholder="HTML, CSS, JavaScript">
                <p class="form-hint">Separate with commas (max 20).</p>
              </div>
            </div>
            <p class="form-error on-light" id="gigFormError" role="alert" hidden></p>
            <div class="modal-footer">
              <a class="btn btn-secondary" href="my-gigs.html">Cancel</a>
              <button type="submit" class="btn btn-primary" id="gigSubmitBtn">Post gig</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../js/pages/post-gig.js"></script>
</body>
</html>
