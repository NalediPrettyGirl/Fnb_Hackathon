<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/skill-arena.css">
  <link rel="stylesheet" href="../css/gig-hub.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/track-guides.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="app-body">
  <!-- Sidebar and top bar are injected by js/components/shell.js -->
  <div class="app-container" id="appContainer">
    <main class="app-main" id="appMain">
      <div class="content-viewport">
        <section class="view-panel active">
          <div class="view-header">
            <div class="view-header-titles">
              
              <h1 class="view-title">Notifications</h1>
              <p class="view-subtitle">Updates about your applications and account.</p>
            </div>
            <div class="view-header-actions"><label class="filter-checkbox-label"><input type="checkbox" id="unreadOnly"> <span>Unread only</span></label><button class="btn btn-secondary" id="markAllBtn" type="button">Mark all read</button></div>
          </div>
          <ul class="notif-page-list notif-list" id="notificationsList"><li class="notif-item"><div class="notif-info"><p class="notif-text">Loading…</p></div></li></ul>
          <div class="pagination" id="notifPagination" hidden>
            <button class="btn btn-secondary-sm" id="notifPrev" type="button">← Previous</button>
            <span id="notifPageLabel"></span>
            <button class="btn btn-secondary-sm" id="notifNext" type="button">Next →</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../js/pages/notifications.js"></script>
</body>
</html>
